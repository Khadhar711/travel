<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Crowd Monitor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #map { height: 100vh; width: 100%; z-index: 1; }

    .crowd-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 14px;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      border: 1px solid rgba(0,0,0,0.1);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .panel-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1a73e8;
    }

    .live-badge {
      background: #ff4d4d;
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .gauge-container {
      margin: 15px 0;
      background: #f0f0f0;
      border-radius: 10px;
      height: 14px;
      overflow: hidden;
    }

    .gauge-fill {
      height: 100%;
      width: 0%;
      transition: width 0.8s ease, background-color 0.5s ease;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 10px;
      color: #444;
    }

    .stats-card {
      background: #f8f9fa;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.85rem;
      border-left: 4px solid #1a73e8;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      text-align: center;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-refresh { background-color: #1a73e8; color: white; }
    .btn-refresh:hover { background-color: #1557b0; }

    .btn-back { background-color: #6c757d; color: white; }
    .btn-back:hover { background-color: #5a6268; }
  </style>
</head>
<body>

  <div class="crowd-panel">
    <div class="panel-header">
      <h2 id="locationName" class="panel-title">📍 Live Crowd Monitor</h2>
      <span class="live-badge">🔴 LIVE</span>
    </div>

    <div class="stats-row">
      <span>Status: <strong id="crowdStatus">Loading...</strong></span>
      <span>Occupancy: <strong id="occupancyText">0%</strong></span>
    </div>

    <div class="gauge-container">
      <div id="gaugeFill" class="gauge-fill"></div>
    </div>

    <div class="stats-card">
      ⏳ <strong>Estimated Queue Wait Time:</strong> <span id="waitTime">Calculating...</span>
    </div>

    <div class="stats-card">
      📈 <strong>Live Crowd Trend:</strong> <span id="liveTrend">Stable ➡️</span>
    </div>

    <div class="stats-card">
      🕒 <strong>Peak Hours:</strong> <span id="peakHours">Loading...</span>
    </div>

    <div class="stats-card">
      🗓️ <strong>Best Time to Visit:</strong> <span id="bestTime">Loading...</span>
    </div>

    <div style="font-size: 0.75rem; color: #888; text-align: right; margin-top: 4px;">
      Last Updated: <span id="lastUpdated">Just now</span>
    </div>

    <div class="btn-group">
      <button id="refreshBtn" class="btn btn-refresh">🔄 Refresh Live Stats</button>
      <a href="index.html" class="btn btn-back">⬅️ Home Portal</a>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const locationId = 'ara';
    let map = null;
    let marker = null;

    async function fetchLiveCrowdData() {
      try {
        const res = await fetch(`/api/crowd/${locationId}`);
        if (res.ok) {
          const data = await res.json();
          updateUI(data);
          updateMap(data);
        }
      } catch (err) {
        console.error('Error fetching live crowd data:', err);
      }
    }

    function updateUI(data) {
      document.getElementById('locationName').textContent = `📍 ${data.name}`;
      document.getElementById('crowdStatus').textContent = data.crowd_level;
      document.getElementById('crowdStatus').style.color = data.status_color;
      document.getElementById('occupancyText').textContent = `${data.occupancy_percent}%`;

      const gauge = document.getElementById('gaugeFill');
      gauge.style.width = `${data.occupancy_percent}%`;
      gauge.style.backgroundColor = data.status_color;

      document.getElementById('waitTime').textContent = data.estimated_wait_time;
      document.getElementById('liveTrend').textContent = data.live_trend;
      document.getElementById('peakHours').textContent = data.peak_hours;
      document.getElementById('bestTime').textContent = data.best_time;
      document.getElementById('lastUpdated').textContent = data.last_updated;
    }

    function updateMap(data) {
      if (!map) {
        map = L.map('map').setView([data.lat, data.lng], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 18,
          attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        marker = L.marker([data.lat, data.lng]).addTo(map);
      }

      const popupContent = `
        <div style="text-align: center; max-width: 220px; font-family: sans-serif;">
          <h3 style="color: #1a73e8; margin-bottom: 4px;">${data.name}</h3>
          <p style="font-size: 0.9rem; font-weight: 700; color: ${data.status_color};">
            Crowd Level: ${data.crowd_level} (${data.occupancy_percent}%)
          </p>
          <p style="font-size: 0.85rem; margin-top: 4px; color: #555;">
            ⏳ Wait Time: ${data.estimated_wait_time}
          </p>
        </div>
      `;

      marker.bindPopup(popupContent).openPopup();
    }

    document.getElementById('refreshBtn').addEventListener('click', fetchLiveCrowdData);
    fetchLiveCrowdData();
  </script>
</body>
</html>
