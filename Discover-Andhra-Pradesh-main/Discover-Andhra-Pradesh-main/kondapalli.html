<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kondapalli Fort - Andhra Pradesh Travel Guide</title>
  <style>
    html {
      scroll-behavior: smooth;
    }

    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      color: white;
    }

    .hero {
      background-image: url('https://upload.wikimedia.org/wikipedia/commons/6/64/Kondapalli_Fort.JPG');
      height: 100vh;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 20px;
    }

    .content h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .content p {
      max-width: 800px;
      margin: 10px auto 30px;
      font-size: 1.2rem;
    }

    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      background-color: #ff9800;
      border: none;
      border-radius: 25px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s, transform 0.2s ease;
    }

    .btn:hover {
      background-color: #e68900;
      transform: scale(1.05);
    }

    .info-section {
      background-color: #222;
      padding: 40px 20px;
      text-align: center;
    }

    .info-section h2 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .info-section p {
      max-width: 900px;
      margin: auto;
      font-size: 1.1rem;
      color: #ddd;
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="overlay"></div>
    <div class="content">
      <h1>Kondapalli Fort</h1>
      <p>Explore the majestic Kondapalli Fort, rich in history and perched atop scenic hills near Vijayawada.</p>
      <div class="buttons">
        <a href="https://en.wikipedia.org/wiki/Kondapalli_Fort" class="btn" target="_blank">About</a>
        <a href="https://www.google.com/maps/place/Kondapalli+Fort/" target="_blank" class="btn">Location</a>
        <a href="kon.html" class="btn">Crowd Info</a>
      </div>
    </div>
  </div>

  
  <div id="crowd" class="info-section">
    <h2>🔴 Live Crowd Monitor & Telemetry</h2>
    <div id="liveCrowdCard" style="max-width: 600px; margin: 20px auto; background: #333; padding: 20px; border-radius: 12px; border-left: 5px solid #ff4d4d; text-align: left;">
      <p>⏳ Loading live crowd telemetry...</p>
    </div>
    <a href="kon.html" class="btn" style="margin-top: 10px; display: inline-block;">🗺️ Open Live Crowd Map</a>
  </div>

  <script>
    async function loadLiveCrowd() {
      try {
        const res = await fetch('/api/crowd/kondapalli');
        if (res.ok) {
          const data = await res.json();
          document.getElementById('liveCrowdCard').innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; font-weight: 700; margin-bottom: 10px;">
              <span>Status: <span style="color: ${data.status_color}">${data.crowd_level}</span> (${data.occupancy_percent}% Occupancy)</span>
              <span style="font-size: 0.85rem; background: #444; padding: 3px 10px; border-radius: 12px; color: #fff;">${data.live_trend}</span>
            </div>
            <div style="background: #444; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 12px;">
              <div style="width: ${data.occupancy_percent}%; height: 100%; background: ${data.status_color};"></div>
            </div>
            <p style="margin: 6px 0; color: #ddd;">⏳ <strong>Estimated Queue Wait:</strong> ${data.estimated_wait_time}</p>
            <p style="margin: 6px 0; color: #ddd;">🕒 <strong>Peak Hours:</strong> ${data.peak_hours}</p>
            <p style="margin: 6px 0; color: #ddd;">🗓️ <strong>Best Time to Visit:</strong> ${data.best_time}</p>
            <p style="margin-top: 10px; font-size: 0.8rem; color: #aaa; text-align: right;">Last updated: ${data.last_updated}</p>
          `;
        }
      } catch (err) {
        console.error('Error loading live crowd:', err);
      }
    }
    window.addEventListener('DOMContentLoaded', loadLiveCrowd);
  </script>
</body>
</html>
